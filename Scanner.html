<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Scanner | Revo Bikes</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ACC8E5;
      color: #112A46;
      margin: 0;
    }

    header {
      background: #8DBBE0;
      padding: 15px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: #112A46;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: #0D3B66;
    }

    h2 {
      text-align: center;
      margin-top: 40px;
    }

    .scanner-box {
      background: white;
      width: 360px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      text-align: center;
    }

    #reader {
      width: 300px;
      margin: auto;
    }

    .details {
      margin-top: 20px;
      text-align: left;
      font-weight: bold;
    }

    .details p {
      margin: 8px 0;
    }

    .note {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 15px;
      color: #2B4A67;
    }
  </style>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="container">
    <nav>
      <h2 style="margin:0;">REVO BIKES</h2>
      <div>
        <a href="index.html">Home</a>
        <a href="route.html">Route</a>
        <a href="pricing.html">Pricing</a>
        <a href="Scanner.html">QR Scanner</a>
        <a href="safety.html">User Details</a>
      </div>
    </nav>
  </div>
</header>

<h2>Scan Your Ride Ticket</h2>

<div class="scanner-box">
  <div id="reader"></div>

  <div class="details" id="details">
    <p>Name: —</p>
    <p>Destination: —</p>
    <p>Fare: —</p>
  </div>
</div>

<p class="note">
  Please allow camera access to scan your ride QR code.
</p>

<script>
  const detailsDiv = document.getElementById("details");

  const html5QrCode = new Html5Qrcode("reader");

  function onScanSuccess(decodedText) {
    html5QrCode.stop();

    const lines = decodedText.split("\n");

    let name = lines[0]?.replace("Name:", "").trim();
    let destination = lines[1]?.replace("Destination:", "").trim();
    let fare = lines[2]?.replace("Fare Price:", "").trim();

    detailsDiv.innerHTML = `
      <p>Name: ${name}</p>
      <p>Destination: ${destination}</p>
      <p>Fare: ${fare}</p>
    `;
  }

  Html5Qrcode.getCameras().then(devices => {
    if (devices.length === 0) {
      alert("No camera found");
      return;
    }

    html5QrCode.start(
      devices[0].id,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  }).catch(err => {
    alert("Camera permission denied. Please allow camera access.");
  });
</script>

</body>
</html>
