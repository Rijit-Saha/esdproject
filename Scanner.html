<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Scanner | Revo Bikes</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ACC8E5;
      color: #112A46;
      margin: 0;
    }

    header {
      background: #8DBBE0;
      padding: 15px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: #112A46;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    h2 {
      text-align: center;
      margin-top: 40px;
    }

    .scanner-box {
      background: white;
      width: 360px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      text-align: center;
    }

    #reader {
      width: 300px;
      margin: auto;
    }

    .details {
      margin-top: 20px;
      text-align: left;
      font-weight: bold;
    }

    .details p {
      margin: 8px 0;
    }

    .note {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 15px;
      color: #2B4A67;
    }

    /* POPUP */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
    }

    .popup-content button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #1abc9c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <h2 style="margin:0;">REVO BIKES</h2>
      <div>
        <a href="index.html">Home</a>
        <a href="route.html">Route</a>
        <a href="pricing.html">Pricing</a>
        <a href="Scanner.html">QR Scanner</a>
        <a href="safety.html">User Details</a>
      </div>
    </nav>
  </div>
</header>

<h2>Scan Your Ride Ticket</h2>

<div class="scanner-box">
  <div id="reader"></div>
  <div class="details" id="details">
    <p>Name: —</p>
    <p>Destination: —</p>
    <p>Fare: —</p>
  </div>
</div>

<p class="note">Please allow camera access to scan your ride QR code.</p>

<!-- POPUP -->
<div id="unlockPopup" class="popup">
  <div class="popup-content">
    <h3>🚲 Bike Unlocked!</h3>
    <p>Enjoy your ride!</p>
    <button onclick="closePopup()">Start Ride</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const detailsDiv = document.getElementById("details");
  const popup = document.getElementById("unlockPopup");
  const qr = new Html5Qrcode("reader");

  function onScanSuccess(text) {
    qr.stop();

    const lines = text.split("\n");
    detailsDiv.innerHTML = `
      <p>Name: ${lines[0] || "-"}</p>
      <p>Destination: ${lines[1] || "-"}</p>
      <p>Fare: ${lines[2] || "-"}</p>
    `;

    popup.style.display = "flex";
  }

  Html5Qrcode.getCameras().then(devices => {
    qr.start(devices[0].id, { fps: 10, qrbox: 250 }, onScanSuccess);
  }).catch(() => {
    alert("Camera permission denied");
  });
});

function closePopup() {
  document.getElementById("unlockPopup").style.display = "none";
}
</script>

</body>
</html>
