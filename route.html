<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Revo Bikes - Route</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ACC8E5;
      margin: 0;
      color: #112A46;
    }

    header {
      background: #ACC8E5;
      padding: 15px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #112A46;
      font-weight: 500;
    }

    .route-section {
      background: #F5F9FC;
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
    }

    h2 {
      text-align: center;
      color: #0D3B66;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }

    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }

    button {
      background: #0D3B66;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #093056;
    }

    #map {
      height: 400px;
      width: 100%;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <strong>REVO BIKES</strong>
      <div>
        <a href="index.html">Home</a>
        <a href="pricing.html">Pricing</a>
        <a href="route.html">Route</a>
        <a href="safety.html">User Details</a>
      </div>
    </nav>
  </div>
</header>

<div class="route-section">
  <h2>Select Route</h2>

  <label>Start Location</label>
  <select id="start">
    <option value="howrah">Howrah Station</option>
    <option value="esplanade">Esplanade</option>
    <option value="parkstreet">Park Street</option>
    <option value="sealdah">Sealdah Station</option>
  </select>

  <label>Destination</label>
  <select id="end">
    <option value="saltlake">Salt Lake</option>
    <option value="collegestreet">College Street</option>
    <option value="jadavpur">Jadavpur University</option>
    <option value="newtown">New Town</option>
  </select>

  <button onclick="calculateRoute()">Show Route</button>

  <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  /* 🔑 OPENROUTESERVICE API KEY */
  const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImU1NjBiMzM1ZWQzODQxNTZiNTcxNTYyMzkyMjk0NmE2IiwiaCI6Im11cm11cjY0In0=";

  /* 📍 LOCATIONS (lon, lat) */
  const locations = {
    howrah: [88.3426, 22.5850],
    esplanade: [88.3510, 22.5656],
    parkstreet: [88.3649, 22.5535],
    sealdah: [88.3697, 22.5676],
    saltlake: [88.4179, 22.5867],
    collegestreet: [88.3636, 22.5746],
    jadavpur: [88.3702, 22.4989],
    newtown: [88.4804, 22.5754]
  };

  /* 🗺️ MAP INIT */
  const map = L.map("map").setView([22.5726, 88.3639], 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  let routeLayer, startMarker, endMarker;

  /* 🎯 CUSTOM ICONS */
  const startIcon = L.icon({
  iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
  shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

const endIcon = L.icon({
  iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
  shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
  /* 🚲 ROUTE FUNCTION */
  function calculateRoute() {
    const startKey = document.getElementById("start").value;
    const endKey = document.getElementById("end").value;

    const start = locations[startKey];
    const end = locations[endKey];

    fetch("https://api.openrouteservice.org/v2/directions/cycling-regular/geojson", {
      method: "POST",
      headers: {
        "Authorization": ORS_API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        coordinates: [start, end]
      })
    })
    .then(res => {
      if (!res.ok) throw new Error("Route API error");
      return res.json();
    })
    .then(data => {
      if (routeLayer) map.removeLayer(routeLayer);
      if (startMarker) map.removeLayer(startMarker);
      if (endMarker) map.removeLayer(endMarker);

      const coords = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
      routeLayer = L.polyline(coords, { weight: 4 }).addTo(map);

      startMarker = L.marker([start[1], start[0]], { icon: startIcon })
        .addTo(map)
        .bindPopup("Start Location")
        .openPopup();

      endMarker = L.marker([end[1], end[0]], { icon: endIcon })
        .addTo(map)
        .bindPopup("Destination");

      map.fitBounds(routeLayer.getBounds());
    })
    .catch(err => {
      alert("Route error: " + err.message);
      console.error(err);
    });
  }
</script>

</body>
</html>
